######## Sidebar ########
logo:
  avatar: '[{config.avatar}](/about/)' # you can set avatar link in _config.yml or '[https://xxx.png](/about/)'
  title: '[{config.title}](/)' # you can set html tag like: '[<img no-lazy height="32px" src="xxx"/>](/)'
  subtitle: 'Code is cheap | Show me ur prompt' # '文字1 | 文字2' (鼠标放上去会切换到文字2)

######## Main ########
# 站点主结构树
site_tree:
  # -- 列表类页面 -- #
  # 主页配置
  home:
    leftbar: welcome, wiki, recent, tagcloud
    rightbar: [timeline]
    per_page: 20
  # -- 内容类页面 -- #
  # 博客文章内页配置
  post:
    menu_id: post # 未在 front-matter 中指定 menu_id 时，layout 为 post 的页面默认使用这里配置的 menu_id
    leftbar: [related, recent, tagcloud, timeline] # for pages using 'layout:post'
    rightbar: [ghrepo, toc]
  # 作者信息配置
  author: 
    base_dir: author # 只影响自动生成的页面路径
    menu_id: post
    leftbar: recent, tagcloud
    rightbar: [timeline]
  # 错误页配置
  error_page:
    menu_id: post
    '404': '/404.html'
    leftbar: recent, tagcloud
    rightbar: [timeline]

######## Article ########
article:
  # 分享
  share: [wechat, weibo, email, link]
  # 相关文章，需要安装插件 (for layout: post)
  # npm i hexo-related-popular-posts
  related_posts:
    enable: true
    max_count: 5

search:
  service: local_search # local_search, todo...
  local_search: # 在 front-matter 中设置 indexing:false 来避免被搜索索引
    field: all # post, page, all
    path: /search.json # 搜索文件存放位置
    content: true # 是否搜索内容


######## Comments ########
comments:
  service: giscus # beaudar, utterances, giscus, twikoo, waline, artalk
  # giscus
  # https://giscus.app/zh-CN
  giscus:
    data-repo: somnifex/blogComment # [在此输入仓库]
    data-repo-id: R_kgDOK_D5qw # [在此输入仓库 ID]
    data-category: Announcements # [在此输入分类名]
    data-category-id: DIC_kwDOK_D5q84CcFu0
    data-mapping: og:title
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top # top, bottom
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

