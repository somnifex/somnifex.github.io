# 站点主题配置：只写需要覆盖主题默认值的字段
# 字段的默认值与可用值见 themes/stellar/_config.yml

# -----------------------------------------------------------------------------
# 布局
# -----------------------------------------------------------------------------

leftbar:
  brand:
    search: true # 需要配置 search.provider
    image:
      src: '{config.avatar}'
      variant: avatar
    name: '{config.title}'
    tagline: 'Code is cheap | Show me ur prompt'
    href: /
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: wiki
      title: 文档
      icon: default:notebook
      url: /wiki/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /标签/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
  footer:
    actions:
      - type: link
        icon: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.9/social/08a41b181ce68.svg
        title: GitHub
        url: https://github.com/somnifex

footer:
  sitemap:
    - title: 博客
      items:
        - '[近期](/)'
        - '[标签](/标签/)'
        - '[归档](/archives/)'
    - title: 更多
      items:
        - '[关于本站](/about/)'
        - '[GitHub](https://github.com/somnifex)'
  content: | # 支持 Markdown 格式
    本站由 [{author.name}](/) 使用 [{theme.name} {theme.version}]({theme.tree}) 主题创建。
    <p>本站由 <a href="https://www.upyun.com/?utm_source=lianmeng&utm_medium=referral" target="_blank"><img src="https://i.096899.xyz/1729389797-又拍云_logo5(1).png" alt="又拍云" style="height: 1.8em; vertical-align: middle;"></a> 提供CDN加速/云存储服务</p>
    <p>本站所有文章除特别声明外，均采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license">CC BY-NC-SA 4.0</a> 许可协议，转载请注明出处。</p>

profiles:
  home:
    leftbar:
      widgets: [wiki, recent, tagcloud]
    rightbar:
      widgets: [timeline]
  post:
    active_menu: post
    leftbar:
      widgets: [related, recent, tagcloud, timeline]
    rightbar:
      widgets: [ghrepo, toc]
  author:
    path: /author/
    active_menu: post
    leftbar:
      widgets: [recent, tagcloud]
    rightbar:
      widgets: [timeline]
  error:
    path: /404.html
    active_menu: post
    leftbar:
      widgets: [recent, tagcloud]
    rightbar:
      widgets: [timeline]

# -----------------------------------------------------------------------------
# 内容
# -----------------------------------------------------------------------------

article:
  related_posts_limit: 5 # 0 表示不显示相关文章
  footer:
    share: [qrcode, weibo, email] # 可用值：qrcode、weibo、x、telegram、whatsapp、email

# -----------------------------------------------------------------------------
# 外观
# -----------------------------------------------------------------------------

appearance:
  # 外观预设：card / glass / minimal / flat。
  # minimal 即主题的「Editorial Minimal 有机编辑式极简」，自带 hue 44 暖纸色系
  # （浅色 --background: hsla(44 50% 96%) / --card: hsla(44 50% 98%)，深色另有一套），
  # 并去掉普通组件的卡片背景/边框/阴影，改用排版与下划线表达层级。
  preset: minimal

  # 语义颜色，取值对齐参考站 xaoxuu.com
  colors:
    primary: hsl(40 96% 55%) # 金：激活态下划线、选中控件、blockquote 悬停
    accent: '#f60' # 橙：Widget / 相关文章悬停文字、button 悬停
    link: hsl(166 66% 32%) # 墨绿：正文链接

  # 排版：衬线正文 + Monaco 代码字体，取值对齐参考站
  typography:
    font_family:
      body: '"Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Songti SC", "Courier New", ui-serif, Georgia, "Times New Roman", serif'
      code: 'Monaco, Menlo, Consolas, system-ui, "Courier New", monospace, sans-serif'

  backgrounds:
    leftbar:
      # 注意：backgrounds.leftbar 仅被 glass 预设消费，card/minimal 下不生效，
      # 此段仅为将来切换 glass 时保留。
      type: gradient # none / gradient / image
      gradient: # 每项需恰好 4 个颜色
        light:
          - hsl(212 16% 98%)
          - hsl(212 16% 98%)
          - hsl(212 16% 98%)
          - hsl(212 16% 98%)
        dark:
          - hsl(212 16% 18%)
          - hsl(212 16% 18%)
          - hsl(212 16% 18%)
          - hsl(212 16% 18%)
      opacity: 1
      backdrop:
        radius: 100px
  code_block:
    scrollbar_width: 4px
    highlight_stylesheet: https://gcore.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css

# -----------------------------------------------------------------------------
# 功能
# -----------------------------------------------------------------------------

search:
  provider: local # local / algolia
  local:
    scope: all # post / page / all
    include_content: true

comments:
  provider: giscus
  giscus: # 参数会作为 data 属性传给 Giscus
    data-repo: somnifex/blogComment
    data-repo-id: R_kgDOK_D5qw
    data-category: Announcements
    data-category-id: DIC_kwDOK_D5q84CcFu0
    data-mapping: og:title
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

tags:
  checkbox:
    interactive: true

features:
  math:
    provider: katex # katex / mathjax
  diagrams:
    provider: mermaid # mermaid

# -----------------------------------------------------------------------------
# 服务与资源
# -----------------------------------------------------------------------------

preconnect:
  - https://gcore.jsdelivr.net
  - https://unpkg.com
  - https://cdn.jsdelivr.net
  - https://cdnjs.cloudflare.com

fallbacks:
  avatar: /img/favicon.png
