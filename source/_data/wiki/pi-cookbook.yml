# 项目描述文件：pi-cookbook
# 文件名即项目 id（与 wiki.yml 中一致）。source/wiki/pi-cookbook/ 下的文档
# 通过目录归属自动关联到本文件。

name: pi-cookbook
headline: Pi Agent Cookbook
tagline: Pi 智能体实用指南 · 22 章 / 5 个示例项目
# 项目简介：用于卡片和 meta 描述
description: |
  基于 Pi 官方文档与社区资源编写的实用指南，覆盖安装、新手入门、AGENTS.md、工具、安全、模型与会话、扩展与自定义工具、多 Agent、自动化、调试、最佳实践、45 个实战食谱与速查表。
tags:
  - Pi
  - Coding Agent
  - 教程
icon: /img/wiki/pi-coding-agent.png
cover: /img/wiki/pi-coding-agent.svg

# 项目路由（站点相对路径）
route:
  path: wiki/pi-cookbook/

leftbar:
  brand:
    # 站内搜索（范围由当前页面自动确定）
    search: true

comments: # 文末评论服务
  provider: giscus
  # 评论区上方的小标题
  title: 讨论与反馈
footer: # true 表示沿用全局 Article 配置
  license: true
  share: true

# 目录树：按读者难度分级，与 README 的"适合谁"对齐
navigation:
  tree:
    '🟢 新手入门':
      - introduction
      - installation
      - beginner-mode
      - basics
      - glossary
    '🟡 进阶使用':
      - agents-md
      - tools
      - security
      - models-providers
      - sessions-context
      - development-workflow
      - prompt-engineering
      - recipes
      - cheatsheet
    '🔴 高级与扩展':
      - extensions
      - custom-tools
      - personal-agents
      - multi-agent
      - automation
      - debugging
      - best-practices
      - anti-patterns
