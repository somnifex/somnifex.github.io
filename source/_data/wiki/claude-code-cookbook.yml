# 项目描述文件：claude-code-cookbook
# 文件名即项目 id（与 wiki.yml 中一致）。source/wiki/claude-code-cookbook/ 下的文档
# 通过目录归属自动关联到本文件。

name: claude-code-cookbook
headline: Claude Code Cookbook
tagline: 从第一次安装到企业级 Agent 基础设施的系统学习手册
description: 面向小白到 Platform Engineer 的 Claude Code 系统学习、日常手册、Agent Engineering 与企业部署参考。内容以 Claude Code 官方文档为准。
tags: [Claude Code, Agent, 技术文档]
icon: /img/wiki/claudecode-color.png
cover: /img/wiki/claudecode-color.svg

# 项目路由（站点相对路径）
route:
  path: wiki/claude-code-cookbook/

# 项目首页 Hero
hero:
  enabled: true

leftbar:
  brand:
    # 站内搜索（范围由当前页面自动确定）
    search: true
  # 左栏组件
  widgets: [tree, related]

comments: # 文末评论服务
  provider: giscus
footer: # true 表示沿用全局 Article 配置
  license: true
  share: true

# 目录树：决定 wiki 文章的分组、顺序与侧边栏标题。
# 叶子项 = source/wiki/claude-code-cookbook/<slug>.md 的文件名（去掉 .md）。
# 支持分层子路径与分组标题。按学习路径分 6 组，保留原 Part 顺序。
