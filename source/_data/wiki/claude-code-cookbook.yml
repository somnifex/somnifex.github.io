  tree:
    '开始（Getting Started）':
      - index
      - installation
      - mental-model
      - surfaces
      - interactive-mode
    '日常开发（Daily Development）':
      - cli-reference
      - claudemd
      - auto-memory
      - context-engineering
      - settings
      - tools
      - permissions
      - sandbox
      - sessions
      - checkpointing
      - daily-workflows
      - prompt-engineering
      - plan-goal-autonomous
    '扩展与自动化（Extensions & Automation）':
      - skills
      - subagents
      - parallel-agents
      - agent-teams
      - dynamic-workflows
      - worktrees
      - hooks
      - mcp
      - plugins
      - channels
      - scheduling-long-running
    '平台与集成（Platform & Integrations）':
      - git
      - code-review-ci
      - web-desktop-mobile
      - browser-computer-use
    'Agent 工程（Agent Engineering）':
      - headless
      - agent-sdk
      - building-custom-agents
      - models
    '企业级（Enterprise）':
      - auth-providers
