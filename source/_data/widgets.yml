# 站点自定义侧边栏组件：覆盖主题 _data/widgets.yml 的同名组件，或新增组件
# 组件的可用布局与参数见 themes/stellar/_data/widgets.yml

timeline:
  layout: timeline
  title: 近期动态
  api: https://memos.iswsh.com/api/v1/memos?creator=users/1&pageSize=6
  type: memos
  hide: user,footer

toc:
  layout: toc
  list_number: false # 是否显示序号
  min_depth: 2 # 建议不要低于 2 即从 H2 标签开始解析（H1标签用于文章大标题）
  max_depth: 6 # 6 代表最多解析到 H6 标签
  collapse: false # true / false / auto (始终折叠/不折叠/自动折叠)

recent:
  layout: recent
  rss: /rss.xml # npm i hexo-generator-feed
  limit: 5 # Count of posts

# 首页左栏的项目文档列表
wiki:
  layout: linklist
  title: 项目文档
  items:
    - title: Claude Code Cookbook
      url: /wiki/claude-code-cookbook/
      icon: /img/wiki/claudecode-color.png
    - title: Pi Agent Cookbook
      url: /wiki/pi-cookbook/
      icon: /img/wiki/pi-coding-agent.png
